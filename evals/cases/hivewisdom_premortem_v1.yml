      initiative_name: Kill the legacy mobile app and move users to the web app
      success_definition: 90% of weekly active mobile users are active on the web app and the iOS app is removed from the store.
      time_horizon: 6_months
      current_state: Users have ignored previous instructions in the in-app banner telling them to switch. We tried a forced redirect once and reverted it after angry reviews.
      team_context: A product manager, two web engineers, and a support lead who will absorb the complaints.
    checks:
