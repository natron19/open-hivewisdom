  - id: edge_long_horizon_large_team
    kind: edge
    variables:
      initiative_name: Consolidate three regional support centers into one follow-the-sun team
      success_definition: First-response time under 2 hours worldwide, no net headcount loss through attrition only, and CSAT stays above 4.3 for every region.
      time_horizon: 12_months
      current_state: Leadership approved the plan. Each center uses a different ticketing tool. The Manila center has the highest CSAT and the lowest pay. No union consultation has happened yet in the Lisbon office.
      team_context: Three regional managers who each expect to lead the merged team, a VP sponsor, an HR partner, and about 90 support agents.
    checks:
