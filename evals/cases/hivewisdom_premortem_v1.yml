# GRADE Goal: turn an initiative brief into a premortem the team could not easily
# write themselves: exactly 5 ranked failure modes with 2-3 measurable warning
# signals each, 5-7 ranked preventive actions, and one uncomfortable avoided truth.
# Top concerns: generic "any startup" failure modes, bland avoided_truth, actions
# that do not address the failure modes, and JSON drift that breaks the parser.
template: hivewisdom_premortem_v1

rubric:
  - dimension: accurate
    criterion: Every failure mode is specific to this initiative and grounded in the stated team, time horizon, and current state; none is a generic failure mode that could apply to any project.
  - dimension: useful
    criterion: The preventive actions together mitigate the top-ranked failure modes and are concrete enough to start this week.
  - dimension: useful
    criterion: The avoided_truth names a specific, uncomfortable dynamic (a relationship, missing skill, unspoken disagreement, or structural constraint) rather than a platitude.
  - dimension: safe
    criterion: The output is professional, does not demean named or implied individuals, and does not recommend unethical or harmful actions.

cases:
  - id: golden_community_garden
    kind: golden
    segment: community_group
    variables:
      initiative_name: Launch a neighborhood community garden on the vacant church lot
      success_definition: Twenty plots are planted by May, at least fifteen households tend them weekly through August, and the church renews the lot agreement for next year.
      time_horizon: 6_months
      current_state: The church council verbally agreed to lend the lot. No written agreement exists. We have $1,200 from a bake sale and a water spigot that has not been tested. Eleven households signed an interest sheet.
      team_context: Three volunteer organizers, one retired landscaper who has strong opinions about layout, and a church liaison who is leaving the council in March.
    checks:
      - { type: json_valid }
      - { type: has_keys, keys: [imagined_failure_date, failure_modes, preventive_actions, avoided_truth] }
      - { type: count_between, path: failure_modes, min: 5, max: 5 }
      - { type: each_has_keys, path: failure_modes, keys: [rank, statement, severity, assumption, warning_signals] }
      - { type: each_has_keys, path: failure_modes.0.warning_signals, keys: [signal, measurement_method] }
      - { type: count_between, path: failure_modes.0.warning_signals, min: 2, max: 3 }
      - { type: values_in, path: failure_modes, field: severity, allowed: [low, medium, high] }
      - { type: count_between, path: preventive_actions, min: 5, max: 7 }
      - { type: each_has_keys, path: preventive_actions, keys: [rank, description, effectiveness_to_effort], dimension: useful }
      - { type: values_in, path: preventive_actions, field: effectiveness_to_effort, allowed: ["1", "2", "3", "4", "5"] }
      - { type: matches, pattern: '"imagined_failure_date"\s*:\s*"\d{4}-\d{2}-\d{2}"' }
    rubric:
      - dimension: accurate
        criterion: At least one failure mode addresses the missing written lot agreement or the departing church liaison.

  - id: golden_product_migration
    kind: golden
    segment: product_team
    variables:
      initiative_name: Migrate billing from our homegrown system to Stripe
      success_definition: All 2,400 active subscriptions bill through Stripe with zero double charges, and the old billing cron is switched off by end of quarter.
      time_horizon: 3_months
      current_state: A spike proved card import works for 50 test accounts. Annual plans with custom discounts have not been mapped. Finance reconciles revenue manually in a spreadsheet each month.
      team_context: Two backend engineers, one of whom wrote the original billing system and is skeptical of the move; a part-time finance contractor; a CEO who promised investors the migration is done this quarter.
    checks:
      - { type: json_valid }
      - { type: has_keys, keys: [imagined_failure_date, failure_modes, preventive_actions, avoided_truth] }
      - { type: count_between, path: failure_modes, min: 5, max: 5 }
      - { type: each_has_keys, path: failure_modes, keys: [rank, statement, severity, assumption, warning_signals] }
      - { type: each_has_keys, path: failure_modes.0.warning_signals, keys: [signal, measurement_method] }
      - { type: count_between, path: failure_modes.0.warning_signals, min: 2, max: 3 }
      - { type: values_in, path: failure_modes, field: severity, allowed: [low, medium, high] }
      - { type: count_between, path: preventive_actions, min: 5, max: 7 }
      - { type: each_has_keys, path: preventive_actions, keys: [rank, description, effectiveness_to_effort], dimension: useful }
      - { type: values_in, path: preventive_actions, field: effectiveness_to_effort, allowed: ["1", "2", "3", "4", "5"] }
      - { type: matches, pattern: '"imagined_failure_date"\s*:\s*"\d{4}-\d{2}-\d{2}"' }
    rubric:
      - dimension: accurate
        criterion: The failure modes reference the unmapped annual discount plans, the manual reconciliation, or the skeptical original author.

